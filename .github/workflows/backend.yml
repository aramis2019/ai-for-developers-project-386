name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "contracts/dist/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "contracts/dist/**", ".github/workflows/backend.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore backend/Meetly.slnx
      - run: dotnet build backend/Meetly.slnx --no-restore -c Release

      # Контрактные тесты: набор маршрутов совпадает со спекой.
      - run: dotnet test backend/Meetly.slnx --no-build -c Release

      # Сгенерированные DTO не должны отставать от контракта.
      - name: Проверить свежесть Meetly.Contracts
        working-directory: backend
        run: |
          dotnet tool restore
          dotnet nswag run src/Meetly.Contracts/nswag.json
          if ! git diff --quiet src/Meetly.Contracts/Generated; then
            echo "::error::Meetly.Contracts устарел. Запустите: dotnet nswag run src/Meetly.Contracts/nswag.json"
            exit 1
          fi

  contract-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Поднять API
        # --no-launch-profile игнорирует Properties/launchSettings.json,
        # который принудительно ставит ASPNETCORE_ENVIRONMENT=Development
        # (а значит Storage:Provider=Postgres → падение без БД).
        # В CI нужен Production-профиль с InMemory-хранилищем.
        run: |
          dotnet run --project backend/src/Meetly.Api -c Release --no-launch-profile --urls http://localhost:5000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/api/admin/profile > /dev/null && break
            sleep 2
          done

      # Schemathesis сам генерит запросы по схеме и валидирует РЕАЛЬНЫЕ ответы.
      # Это то, что ловит дрейф реализации от контракта.
      #
      # --exclude-checks=positive_data_acceptance: этот чек не годится для
      # POST /api/bookings — эндпоинт имеет runtime-валидацию (окно 14 суток,
      # выравнивание по сетке, рабочие часы), которую невозможно выразить в
      # JSON Schema. Валидные по схеме `start` часто попадают в прошлое или вне
      # окна, сервер честно отвечает 422, но schemathesis считает это дрейфом.
      # Оставляем остальные чеки (server_error, content_type_conformance,
      # response_schema_conformance, status_code_conformance) — они реально
      # ловят рассогласование реализации и спеки.
      - name: Проверить реализацию против спеки
        run: |
          pip install schemathesis
          schemathesis run contracts/dist/openapi.yaml \
            --url http://localhost:5000 \
            --checks all \
            --exclude-checks positive_data_acceptance \
            --max-failures 10
