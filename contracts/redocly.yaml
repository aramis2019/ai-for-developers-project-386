# Конфигурация линтера OpenAPI (redocly lint dist/openapi.yaml).
# Отключённые правила — осознанные решения контракта, а не недоработки.

extends:
  - recommended

apis:
  meetly:
    root: dist/openapi.yaml

rules:
  # В системе по условию нет регистрации и авторизации: админская часть работает
  # от заранее заданного профиля владельца, гость бронирует анонимно.
  # Схем безопасности в контракте нет намеренно.
  security-defined: off

  # Часть GET-эндпоинтов не может завершиться клиентской ошибкой:
  # профиль владельца существует всегда, списки возвращают пустой массив.
  # Придумывать для них 4xx только ради линтера — вводить клиента в заблуждение.
  operation-4xx-response: off

  # Единственный объявленный сервер — локальный стенд разработки.
  # Production-адрес появится вместе с деплоем.
  no-server-example.com: off
